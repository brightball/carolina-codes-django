# Carolina Code Conference Fly org: carolina-code-conference
# Public hostname: carolina-codes-django.fly.dev

app = "carolina-codes-django"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  CAROLINA_URL = "http://carolina-codes.internal:8080"
  PUBLIC_BASE_URL = "https://carolina-codes-django.fly.dev"
  DJANGO_DB_POOL = "2"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Scale to zero when idle. The main app keeps a language API warm.
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "40s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
