# Local pre-commit hooks. Emergency escape:
# SKIP=tests,sast,audit,gitleaks,style git commit
# Install once: uv sync && uv run pre-commit install
# gitleaks must be on PATH (mise.toml pins 8.30.1).
repos:
  - repo: local
    hooks:
      - id: tests
        name: tests
        language: system
        entry: uv run python manage.py test
        pass_filenames: false
        always_run: true
      - id: sast
        name: sast
        language: system
        entry: uv run bandit -r catalog config manage.py -x catalog/tests.py
        pass_filenames: false
        always_run: true
      - id: audit
        name: audit
        language: system
        entry: uv run pip-audit
        pass_filenames: false
        always_run: true
      - id: gitleaks
        name: gitleaks
        language: system
        entry: gitleaks detect --source . --verbose --no-banner
        pass_filenames: false
        always_run: true
      - id: style
        name: style
        language: system
        entry: uv run ruff check .
        pass_filenames: false
        always_run: true
